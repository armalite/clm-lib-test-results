# Repository default configuration for returns-svc.
# Build release notes and APPLIED change records override these values.
service: returns-svc
clients:
  tax-engine:
    base_url: http://tax-engine.internal
    timeout_ms: 2500
database:
  host: returns-svc-db.internal
  pool:
    max_size: 48
    acquire_timeout_ms: 5000
cache:
  ttl_s: 120
