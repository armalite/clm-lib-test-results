# Repository default configuration for payments-api.
# Build release notes and APPLIED change records override these values.
service: payments-api
clients:
  risk-score:
    base_url: http://risk-score.internal
    timeout_ms: 2500
database:
  host: payments-api-db.internal
  pool:
    max_size: 60
    acquire_timeout_ms: 5000
cache:
  ttl_s: 120
