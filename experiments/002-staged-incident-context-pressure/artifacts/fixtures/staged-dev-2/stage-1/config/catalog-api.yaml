# Repository default configuration for catalog-api.
# Build release notes and APPLIED change records override these values.
service: catalog-api
clients:
  ledger-api:
    base_url: http://ledger-api.internal
    timeout_ms: 2500
database:
  host: catalog-api-db.internal
  pool:
    max_size: 60
    acquire_timeout_ms: 5000
cache:
  ttl_s: 120
