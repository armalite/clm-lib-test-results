# Repository default configuration for shipping-api.
# Build release notes and APPLIED change records override these values.
service: shipping-api
clients:
  pricing-core:
    base_url: http://pricing-core.internal
    timeout_ms: 2500
database:
  host: shipping-api-db.internal
  pool:
    max_size: 48
    acquire_timeout_ms: 5000
cache:
  ttl_s: 120
