# Repository default configuration for shipping-api (build 4.31.3).
# Deploy-time overrides are recorded in deploy/changes.log.
service: shipping-api
listen_port: 8443
log:
  level: info
database:
  host: shipping-api-db.internal
  pool:
    max_size: 40
    min_idle: 4
    acquire_timeout_ms: 5000
cache:
  ttl_s: 120
  max_entries: 5000
