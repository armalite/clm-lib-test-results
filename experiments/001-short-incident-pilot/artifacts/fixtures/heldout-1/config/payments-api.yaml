# Repository default configuration for payments-api (build 5.30.8).
# Deploy-time overrides are recorded in deploy/changes.log.
service: payments-api
listen_port: 8080
log:
  level: info
tls:
  client_bundle: /etc/certs/payments-api-mtls.pem
database:
  pool:
    max_size: 32
cache:
  ttl_s: 120
  max_entries: 5000
