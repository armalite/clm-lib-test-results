# Repository default configuration for profile-svc.
# Build release notes and APPLIED change records override these values.
service: profile-svc
clients:
  ledger-api:
    base_url: http://ledger-api.internal
    timeout_ms: 2500
database:
  host: profile-svc-db.internal
  pool:
    max_size: 48
    acquire_timeout_ms: 5000
cache:
  ttl_s: 120
